<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>好友档案</title> <!-- 修复：移除了 title 中的 span，防止 JS 报错 -->

<!-- 引入卡通字体 ZCOOL KuaiLe -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">

<style>
  /* ============ 基础重置 ============ */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    /* 更柔和的卡通渐变背景 */
    background: linear-gradient(135deg, #fffdf5 0%, #fdf4e3 50%, #f0f7ff 100%);
    font-family: 'ZCOOL KuaiLe', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    color: #5a4633;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 44px 20px calc(60px + env(safe-area-inset-bottom));
    position: relative;
    overflow-x: hidden;
  }

  /* ============ 背景装饰：云朵 & 星星 ============ */
  .decor { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .cloud {
    --w: 130px; position: absolute; width: var(--w); height: calc(var(--w) * 0.36);
    background: #ffffff; border-radius: 999px; opacity: .9;
    animation-name: floaty; animation-timing-function: ease-in-out; animation-iteration-count: infinite;
    box-shadow: 0 10px 20px rgba(190, 165, 120, .1);
  }
  .cloud::before, .cloud::after { content: ''; position: absolute; background: #ffffff; border-radius: 50%; }
  .cloud::before { width: calc(var(--w) * 0.46); height: calc(var(--w) * 0.46); left: calc(var(--w) * 0.13); top: calc(var(--w) * -0.24); }
  .cloud::after { width: calc(var(--w) * 0.34); height: calc(var(--w) * 0.34); right: calc(var(--w) * 0.13); top: calc(var(--w) * -0.15); }
  @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  .star { position: absolute; line-height: 1; opacity: .6; animation-name: twinkle; animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-duration: 3.4s; user-select: none; }
  @keyframes twinkle { 0%, 100% { opacity: .35; transform: scale(.9) rotate(-6deg); } 50% { opacity: .85; transform: scale(1.18) rotate(10deg); } }

  /* ============ 页面主体 ============ */
  .page { position: relative; z-index: 1; width: min(800px, 100%); display: flex; flex-direction: column; align-items: center; }
  .hero { text-align: center; margin-bottom: 26px; }
  .title {
    margin: 0 0 8px; font-family: 'ZCOOL KuaiLe', 'PingFang SC', 'Microsoft YaHei', cursive;
    font-size: clamp(38px, 8vw, 68px); letter-spacing: 6px; line-height: 1.15;
    background: linear-gradient(100deg, #ff6b6b 0%, #ffa94d 20%, #ffd43b 38%, #69db7c 56%, #4dabf7 76%, #b197fc 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
    filter: drop-shadow(2px 3px 0 #ffffff) drop-shadow(0 8px 14px rgba(255, 160, 80, .38));
  }
  .subtitle { margin: 0; font-size: clamp(15px, 3.4vw, 19px); color: #b08d5e; letter-spacing: 2px; }

  /* ============ 白色卡片（立体软糖感） ============ */
  .card {
    width: 100%; background: #ffffff; border-radius: 40px; padding: 36px 38px 40px;
    border: 6px solid #ffffff;
    box-shadow: 0 20px 44px rgba(190, 158, 108, .2), 0 8px 0 #f2e5cc, 0 2px 0 rgba(255, 255, 255, .9) inset;
  }

  /* ============ 表单字段样式 ============ */
  .field-row { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 24px; }
  .field-col { flex: 1; min-width: 140px; }
  
  .field-label { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 20px; line-height: 1.45; color: #6b4f2a; letter-spacing: 1px; }
  .badge { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; font-size: 15px; color: #ffffff; background: linear-gradient(160deg, #ffd166, #ffa93d); box-shadow: 0 3px 0 #eaa138; }

  .text-input {
    width: 100%; padding: 14px 18px; font-family: inherit; font-size: 18px; color: #5a4633;
    background: #fffaf0; border: 3px solid #ffe3b0; border-radius: 16px; outline: none;
    transition: border-color .18s ease, background .18s ease, box-shadow .18s ease;
  }
  .text-input:focus { border-color: #ffb84d; background: #ffffff; box-shadow: 0 0 0 6px rgba(255, 200, 110, .22); }
  .text-input::placeholder { color: #ccb99c; font-size: 16px; }

  /* 选项组 */
  .options-group { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .option {
    position: relative; display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 20px; border-radius: 999px; background: #fffaf0; border: 3px solid #ffe3b0;
    font-size: 17px; color: #6b4f2a; cursor: pointer; user-select: none;
    transition: transform .16s ease, background .16s ease, border-color .16s ease, box-shadow .16s ease;
    overflow: hidden; /* 确保绝对定位的 input 不会溢出 */
  }
  
  /* 修复：让原生输入框完全覆盖整个 option 区域，确保 iPad 点击 100% 触发 */
  .option input[type="radio"], .option input[type="checkbox"] {
    position: absolute; opacity: 0; width: 100%; height: 100%; left: 0; top: 0; margin: 0; cursor: pointer; z-index: 10;
  }
  
  /* 自定义标记 */
  .radio-mark, .checkbox-mark { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 3px solid #ffc46b; background: #ffffff; position: relative; transition: all .16s ease; }
  .checkbox-mark { border-radius: 6px; }
  
  .option.selected { background: #fff3d6; border-color: #ffb84d; transform: translateY(-2px); box-shadow: 0 5px 0 #ffe1ae; }
  .option.selected .radio-mark { border-color: #ff9f43; background: #ff9f43; }
  .option.selected .radio-mark::after { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: #ffffff; }
  .option.selected .checkbox-mark { border-color: #ff9f43; background: #ff9f43; }
  .option.selected .checkbox-mark::after { content: '✔'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 14px; font-weight: bold; }

  /* 其他输入框 */
  .other-input { width: 110px; padding: 8px 12px; border: 3px solid #ffe3b0; border-radius: 12px; font-family: inherit; font-size: 16px; background: #fffaf0; outline: none; z-index: 20; position: relative; }
  .other-input:focus { border-color: #ffb84d; background: #ffffff; }

  /* 提交按钮 */
  .submit-btn {
    display: block; width: 100%; margin-top: 20px; padding: 18px 20px;
    font-family: inherit; font-size: 24px; letter-spacing: 6px; text-indent: 6px;
    color: #ffffff; background: linear-gradient(180deg, #ffb057 0%, #ff8b3d 100%);
    border: none; border-radius: 999px; cursor: pointer;
    box-shadow: 0 9px 0 #e0702a, 0 16px 26px rgba(255, 140, 60, .34);
    transition: transform .09s ease, box-shadow .09s ease, filter .18s ease;
    touch-action: manipulation;
  }
  .submit-btn:active:not(:disabled) { transform: translateY(7px); box-shadow: 0 2px 0 #e0702a, 0 6px 12px rgba(255, 140, 60, .28); }
  .submit-btn:disabled { filter: saturate(.55) brightness(1.04); cursor: not-allowed; opacity: .85; }

  /* 弹窗 */
  .modal-mask { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(96, 74, 44, .34); backdrop-filter: blur(4px); opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility .25s ease; }
  .modal-mask.show { opacity: 1; visibility: visible; }
  .modal { width: min(430px, 100%); padding: 38px 36px 32px; text-align: center; background: #ffffff; border: 6px solid #ffe8bd; border-radius: 34px; box-shadow: 0 24px 54px rgba(130, 96, 46, .32); transform: scale(.82) translateY(22px); transition: transform .34s cubic-bezier(.34, 1.56, .64, 1); }
  .modal-mask.show .modal { transform: scale(1) translateY(0); }
  .modal-emoji { font-size: 66px; line-height: 1; margin-bottom: 18px; animation: pop 1.6s ease-in-out infinite; }
  @keyframes pop { 0%, 100% { transform: scale(1) rotate(-4deg); } 50% { transform: scale(1.12) rotate(4deg); } }
  .modal-text { margin: 0 0 26px; font-size: 22px; line-height: 1.5; color: #6b4f2a; letter-spacing: 1px; }
  .modal-btn { padding: 14px 46px; font-family: inherit; font-size: 20px; letter-spacing: 3px; color: #ffffff; background: linear-gradient(180deg, #8ed07a 0%, #5cb85c 100%); border: none; border-radius: 999px; cursor: pointer; box-shadow: 0 7px 0 #46a046; transition: transform .09s ease, box-shadow .09s ease; }
  .modal-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #46a046; }
</style>
</head>

<body>

<div class="decor" id="decor" aria-hidden="true"></div>

<main class="page">
  <header class="hero">
    <h1 class="title">好友档案</h1>
    <p class="subtitle">✨ 快来完成你的专属小档案吧 ✨</p>
  </header>

  <section class="card">
    <form id="surveyForm" autocomplete="off" novalidate>
      <!-- 1. 姓名 -->
      <div class="field-row">
        <div class="field-col">
          <div class="field-label"><span class="badge">1</span> 姓名</div>
          <input type="text" id="name" class="text-input" placeholder="请输入你的姓名">
        </div>
      </div>

      <!-- 2. 性别 / 3. 年龄 -->
      <div class="field-row">
        <div class="field-col">
          <div class="field-label"><span class="badge">2</span> 性别</div>
          <input type="text" id="gender" class="text-input" placeholder="男 / 女">
        </div>
        <div class="field-col">
          <div class="field-label"><span class="badge">3</span> 年龄</div>
          <input type="text" id="age" class="text-input" placeholder="例如：10">
        </div>
      </div>

      <!-- 4. 身高 / 5. 体重 -->
      <div class="field-row">
        <div class="field-col">
          <div class="field-label"><span class="badge">4</span> 身高 (cm)</div>
          <input type="text" id="height" class="text-input" placeholder="例如：140">
        </div>
        <div class="field-col">
          <div class="field-label"><span class="badge">5</span> 体重 (kg)</div>
          <input type="text" id="weight" class="text-input" placeholder="例如：35">
        </div>
      </div>

      <!-- 6. 最喜欢的运动 (多选+其他) -->
      <div class="field-row" style="flex-direction: column; gap: 10px;">
        <div class="field-label"><span class="badge">6</span> 你最喜欢的运动</div>
        <div class="options-group">
          <label class="option"><input type="checkbox" name="sport" value="篮球"><span class="checkbox-mark"></span> 篮球</label>
          <label class="option"><input type="checkbox" name="sport" value="跑步"><span class="checkbox-mark"></span> 跑步</label>
          <label class="option"><input type="checkbox" name="sport" value="跳绳"><span class="checkbox-mark"></span> 跳绳</label>
          <label class="option"><input type="checkbox" name="sport" value="其他" id="sport-other-check"><span class="checkbox-mark"></span> 其他</label>
          <input type="text" id="sport-other-text" class="other-input" placeholder="请填写">
        </div>
      </div>

      <!-- 7. 踢毽子 -->
      <div class="field-row" style="flex-direction: column; gap: 10px;">
        <div class="field-label"><span class="badge">7</span> 你喜欢踢毽子吗？</div>
        <div class="options-group">
          <label class="option"><input type="radio" name="jianzi" value="不喜欢"><span class="radio-mark"></span> 不喜欢</label>
          <label class="option"><input type="radio" name="jianzi" value="比较喜欢"><span class="radio-mark"></span> 比较喜欢</label>
          <label class="option"><input type="radio" name="jianzi" value="喜欢"><span class="radio-mark"></span> 喜欢</label>
        </div>
      </div>

      <!-- 8. 游泳 -->
      <div class="field-row" style="flex-direction: column; gap: 10px;">
        <div class="field-label"><span class="badge">8</span> 你喜欢游泳吗？</div>
        <div class="options-group">
          <label class="option"><input type="radio" name="swim" value="不喜欢"><span class="radio-mark"></span> 不喜欢</label>
          <label class="option"><input type="radio" name="swim" value="比较喜欢"><span class="radio-mark"></span> 比较喜欢</label>
          <label class="option"><input type="radio" name="swim" value="喜欢"><span class="radio-mark"></span> 喜欢</label>
        </div>
      </div>

      <!-- 9. 旅游 -->
      <div class="field-row" style="flex-direction: column; gap: 10px;">
        <div class="field-label"><span class="badge">9</span> 你喜欢旅游吗？</div>
        <div class="options-group">
          <label class="option"><input type="radio" name="travel" value="不喜欢"><span class="radio-mark"></span> 不喜欢</label>
          <label class="option"><input type="radio" name="travel" value="喜欢"><span class="radio-mark"></span> 喜欢</label>
        </div>
      </div>

      <!-- 10. 最想去哪里旅游 (单选+其他) -->
      <div class="field-row" style="flex-direction: column; gap: 10px;">
        <div class="field-label"><span class="badge">10</span> 你最想去哪里旅游</div>
        <div class="options-group">
          <label class="option"><input type="radio" name="travel_place" value="南京"><span class="radio-mark"></span> 南京</label>
          <label class="option"><input type="radio" name="travel_place" value="北京"><span class="radio-mark"></span> 北京</label>
          <label class="option"><input type="radio" name="travel_place" value="新疆"><span class="radio-mark"></span> 新疆</label>
          <label class="option"><input type="radio" name="travel_place" value="其他" id="travel-other-check"><span class="radio-mark"></span> 其他</label>
          <input type="text" id="travel-other-text" class="other-input" placeholder="请填写">
        </div>
      </div>

      <!-- 11. 旅游频率 -->
      <div class="field-row" style="flex-direction: column; gap: 10px;">
        <div class="field-label"><span class="badge">11</span> 你多久出去旅游一次</div>
        <div class="options-group">
          <label class="option"><input type="radio" name="travel_freq" value="从不旅游"><span class="radio-mark"></span> 从不旅游</label>
          <label class="option"><input type="radio" name="travel_freq" value="偶尔旅游"><span class="radio-mark"></span> 偶尔旅游</label>
          <label class="option"><input type="radio" name="travel_freq" value="经常旅游"><span class="radio-mark"></span> 经常旅游</label>
        </div>
      </div>

    </form>
    <button id="submitBtn" class="submit-btn" type="button">提 交</button>
  </section>
</main>

<div class="modal-mask" id="modalMask">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-emoji" id="modalEmoji">🎉</div>
    <p class="modal-text" id="modalText"></p>
    <button class="modal-btn" id="modalBtn" type="button">好的</button>
  </div>
</div>

<script>
// 使用 DOMContentLoaded 确保所有元素加载完毕后再执行脚本
document.addEventListener('DOMContentLoaded', function () {
  'use strict';

  var API_URL = 'https://quickform.cn/api/e3cuz2onge';
  var params = new URLSearchParams(window.location.search);
  var group = params.get('group') || '1';

  // 修复：只更新页面正文中的组号显示
  var groupDisplay = document.getElementById('group-num-display');
  if (groupDisplay) groupDisplay.innerText = group;

  /* ============ 选项选中样式切换 ============ */
  var options = document.querySelectorAll('.option');
  options.forEach(function (label) {
    var input = label.querySelector('input');
    if (!input) return;
    
    // 监听 change 事件更新样式
    input.addEventListener('change', function () {
      if (input.type === 'radio') {
        // 找到同名的所有 radio，移除选中样式
        var sameName = document.querySelectorAll('input[name="' + input.name + '"]');
        sameName.forEach(function (r) {
          var parentLabel = r.closest('.option');
          if (parentLabel) parentLabel.classList.toggle('selected', r.checked);
        });
      } else {
        label.classList.toggle('selected', input.checked);
      }
    });
  });

  /* ============ 获取选中的值 ============ */
  function getSelectedRadio(name) {
    var checked = document.querySelector('input[name="' + name + '"]:checked');
    return checked ? checked.value : '';
  }

  function getSelectedCheckboxes(name) {
    var checked = document.querySelectorAll('input[name="' + name + '"]:checked');
    var values = [];
    checked.forEach(function (el) { values.push(el.value); });
    return values.join(', ');
  }

  /* ============ 弹窗逻辑 ============ */
  var modalMask = document.getElementById('modalMask');
  var modalEmoji = document.getElementById('modalEmoji');
  var modalText = document.getElementById('modalText');
  var modalBtn = document.getElementById('modalBtn');

  function showModal(type, message, btnLabel) {
    var emojis = { success: '🎉', error: '😢', warn: '✏️' };
    modalEmoji.textContent = emojis[type] || '🎉';
    modalText.textContent = message;
    modalBtn.textContent = btnLabel || '好的';
    modalMask.classList.add('show');
  }

  function hideModal() { modalMask.classList.remove('show'); }
  modalBtn.addEventListener('click', hideModal);
  modalMask.addEventListener('click', function (e) { if (e.target === modalMask) hideModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hideModal(); });

  /* ============ 提交逻辑 ============ */
  var submitBtn = document.getElementById('submitBtn');
  var submitting = false;

  submitBtn.addEventListener('click', function (e) {
    e.preventDefault(); // 阻止可能存在的默认行为
    if (submitting) return;

    // 1. 简单校验（姓名必填）
    var name = document.getElementById('name').value.trim();
    if (!name) {
      showModal('warn', '请先填写你的姓名哦～', '好的');
      document.getElementById('name').focus();
      return;
    }

    // 2. 收集数据
    var payload = {
      group: group,  // 隐藏字段：组号
      "姓名": name,
      "性别": document.getElementById('gender').value.trim(),
      "年龄": document.getElementById('age').value.trim(),
      "身高": document.getElementById('height').value.trim(),
      "体重": document.getElementById('weight').value.trim(),
      "你最喜欢的运动": getSelectedCheckboxes('sport'),
      "你最喜欢的运动_其他": document.getElementById('sport-other-text').value.trim(),
      "你喜欢踢毽子吗": getSelectedRadio('jianzi'),
      "你喜欢游泳吗": getSelectedRadio('swim'),
      "你喜欢旅游吗": getSelectedRadio('travel'),
      "你最想去哪里旅游": getSelectedRadio('travel_place'),
      "你最想去哪里旅游_其他": document.getElementById('travel-other-text').value.trim(),
      "你多久出去旅游一次": getSelectedRadio('travel_freq')
    };

    // 3. 提交
    submitting = true;
    submitBtn.disabled = true;
    var originalText = submitBtn.textContent;
    submitBtn.textContent = '提交中…';

    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res;
      })
      .then(function () {
        showModal('success', '提交成功，感谢参与！', '好的');
      })
      .catch(function (err) {
        console.error('提交失败：', err);
        showModal('error', '网络开小差了，请重试', '再试一次');
      })
      .finally(function () {
        submitting = false;
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
      });
  });

  // 如果选中“其他”，自动聚焦到输入框
  var sportOtherCheck = document.getElementById('sport-other-check');
  var sportOtherText = document.getElementById('sport-other-text');
  if (sportOtherCheck && sportOtherText) {
    sportOtherCheck.addEventListener('change', function() {
      if (this.checked) sportOtherText.focus();
    });
  }
  
  var travelOtherCheck = document.getElementById('travel-other-check');
  var travelOtherText = document.getElementById('travel-other-text');
  if (travelOtherCheck && travelOtherText) {
    travelOtherCheck.addEventListener('change', function() {
      if (this.checked) travelOtherText.focus();
    });
  }

  /* ============ 背景装饰构建 ============ */
  var decor = document.getElementById('decor');
  // 增加更多的云朵
  var clouds = [
    { top: '4%', left: '4%', w: 132, delay: 0, dur: 9 },
    { top: '12%', right: '5%', w: 108, delay: 1.5, dur: 11 },
    { top: '28%', left: '2%', w: 100, delay: 0.8, dur: 10 },
    { top: '45%', right: '6%', w: 144, delay: 2.2, dur: 12 },
    { top: '65%', left: '1%', w: 88, delay: 1.1, dur: 8 },
    { top: '82%', right: '3%', w: 120, delay: 0.5, dur: 10 }
  ];
  clouds.forEach(function (c) {
    var el = document.createElement('div');
    el.className = 'cloud';
    el.style.top = c.top;
    if (c.left) el.style.left = c.left;
    if (c.right) el.style.right = c.right;
    el.style.setProperty('--w', c.w + 'px');
    el.style.animationDelay = c.delay + 's';
    el.style.animationDuration = c.dur + 's';
    decor.appendChild(el);
  });

  // 增加更多的星星
  var stars = [
    { e: '⭐', top: '4%', left: '26%', size: 22, delay: 0 },
    { e: '✨', top: '13%', right: '27%', size: 20, delay: 0.8 },
    { e: '⭐', top: '30%', left: '11%', size: 17, delay: 1.4 },
    { e: '✨', top: '52%', right: '4%', size: 20, delay: 0.4 },
    { e: '⭐', top: '84%', left: '20%', size: 18, delay: 1.1 },
    { e: '✨', top: '70%', right: '26%', size: 17, delay: 1.8 },
    { e: '🌟', top: '20%', left: '45%', size: 16, delay: 0.6 },
    { e: '⭐', top: '90%', right: '15%', size: 19, delay: 2.0 }
  ];
  stars.forEach(function (s) {
    var el = document.createElement('span');
    el.className = 'star';
    el.textContent = s.e;
    el.style.top = s.top;
    if (s.left) el.style.left = s.left;
    if (s.right) el.style.right = s.right;
    el.style.fontSize = s.size + 'px';
    el.style.animationDelay = s.delay + 's';
    decor.appendChild(el);
  });

});
</script>
</body>
</html>
